name: Fabric 26.3 dedicated-server smoke

on:
  push:
    branches:
      - optimize/fabric-26.3-idle-20m-v1
      - optimize/fabric-26.3-stack-lowmem-v1
      - optimize/fabric-26.3-end-bottom-exit-v1
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  headless-server:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - end_destination: minecraft:overworld
            artifact_suffix: overworld
          - end_destination: immersive_portals:skyland
            artifact_suffix: skyland
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare two plausible Loom run directories
        shell: bash
        run: |
          mkdir -p fabric/runs/server runs/server
          for d in fabric/runs/server runs/server; do
            printf 'eula=true\n' > "$d/eula.txt"
            cat > "$d/server.properties" <<'PROPS'
          online-mode=false
          view-distance=5
          simulation-distance=4
          max-players=2
          spawn-protection=0
          PROPS
          done
      - name: Configure three-layer stack and one-way End floor exit
        shell: bash
        run: |
          for d in fabric/runs/server runs/server; do
            mkdir -p "$d/config"
            cat > "$d/config/immersive_portals.json" <<'JSON'
          {
            "lowMemoryServerMode": true,
            "lowMemoryServerMaxPortalRadius": 3,
            "lowMemoryServerStackMaxPortalRadius": 2,
            "lowMemoryServerStackSafeRangeBlocks": 32,
            "lowMemoryServerDiagnostics": true,
            "dimStackPreset": {
              "loop": false,
              "gravityTransform": false,
              "endBottomExitTarget": "__END_EXIT_TARGET__",
              "endBottomExitCeilingOffsetBlocks": 32,
              "entries": [
                {
                  "dimensionIdStr": "immersive_portals:skyland",
                  "scale": 1.0,
                  "flipped": false,
                  "bedrockReplacementStr": "minecraft:obsidian"
                },
                {
                  "dimensionIdStr": "minecraft:overworld",
                  "scale": 1.0,
                  "flipped": false,
                  "bedrockReplacementStr": "minecraft:obsidian"
                },
                {
                  "dimensionIdStr": "minecraft:the_nether",
                  "scale": 1.0,
                  "flipped": false,
                  "bedrockReplacementStr": "minecraft:obsidian"
                }
              ]
            }
          }
          JSON
            sed -i "s|__END_EXIT_TARGET__|${{ matrix.end_destination }}|g" "$d/config/immersive_portals.json"
          done
          python3 - <<'PY'
          import json
          with open('fabric/runs/server/config/immersive_portals.json') as f:
              cfg=json.load(f)
          stack=cfg['dimStackPreset']
          assert stack['loop'] is False
          ids=[e['dimensionIdStr'] for e in stack['entries']]
          assert ids == ['immersive_portals:skyland', 'minecraft:overworld', 'minecraft:the_nether']
          assert all(e['scale'] == 1 for e in stack['entries'])
          assert stack['endBottomExitTarget'] in ('minecraft:overworld', 'immersive_portals:skyland')
          assert stack['endBottomExitCeilingOffsetBlocks'] == 32
          print('PASS: three-layer 1:1 stack and independent one-way End escape configured')
          PY
      - name: Boot dedicated Fabric server and detect ready state
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          setsid ./gradlew :fabric:runServer --console=plain --no-daemon \
            > server-smoke.log 2>&1 &
          runner_pid=$!
          trap 'kill -TERM -- -"$runner_pid" 2>/dev/null || true' EXIT
          for ((i=1; i<=175; i++)); do
            if grep -Eq 'Done \([0-9.,]+s\)!|Done \([0-9.,]+s\)' server-smoke.log; then
              if ! grep -Fq 'Applying dimension stack preset in dedicated server' server-smoke.log; then
                echo "FAIL: server booted, but stack preset was not loaded"
                tail -n 110 server-smoke.log
                exit 1
              fi
              if ! grep -Fq 'Installed one-way End floor exit to ${{ matrix.end_destination }}' server-smoke.log; then
                echo "FAIL: no server-side End floor portal installation for requested destination"
                tail -n 130 server-smoke.log
                exit 1
              fi
              echo "PASS: three-layer stack and one-way End floor portal installed for ${{ matrix.end_destination }}"
              tail -n 50 server-smoke.log
              exit 0
            fi
            if ! kill -0 "$runner_pid" 2>/dev/null; then
              echo "FAIL: Gradle server process exited before ready"
              tail -n 150 server-smoke.log
              exit 1
            fi
            if (( i % 20 == 0 )); then
              echo "Server startup probe at check $i"
              tail -n 10 server-smoke.log || true
            fi
            sleep 1
          done
          echo "FAIL: dedicated Fabric server not ready within validation window"
          tail -n 150 server-smoke.log
          exit 1
      - name: Save server startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-26.3-end-exit-${{ matrix.artifact_suffix }}-smoke-log
          path: server-smoke.log
          if-no-files-found: warn
          retention-days: 7
